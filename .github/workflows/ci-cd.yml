name: CI/CD Pipeline

on:
  push:
    branches: [ main, staging, dev ]
  pull_request:
    branches: [ main, staging, dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run linting with ruff
      run: |
        pip install ruff
        ruff check .
    
    - name: Run formatting check with black
      run: |
        pip install black
        black --check .
    
    - name: Run tests
      run: |
        pip install pytest
        pytest tests/ -v
    
  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image
      run: |
        docker build -t ml-app:${{ github.sha }} .
    
    - name: Test Docker image
      run: |
        docker run --rm ml-app:${{ github.sha }} python -c "import flask; print('Flask imported successfully')"
    
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Create staging .env file
      run: |
        echo "Creating staging environment file"
        cat << EOF > .env.staging
        MODEL_PATH=ml/registry/model.pkl
        ENVIRONMENT=staging
        EOF
    
    - name: Build staging image
      run: |
        docker build -t ml-app:staging-${{ github.sha }} .
    
  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Create production .env file
      run: |
        echo "Creating production environment file"
        cat << EOF > .env.production
        MODEL_PATH=ml/registry/model.pkl
        ENVIRONMENT=production
        EOF
    
    - name: Build production image
      run: |
        docker build -t ml-app:prod-${{ github.sha }} .