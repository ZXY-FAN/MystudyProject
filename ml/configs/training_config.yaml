data:
  test_size: 0.2
  random_state: 42
  validation_size: 0.1

model:
  random_forest:
    n_estimators: 100
    max_depth: 10
    min_samples_split: 2
    min_samples_leaf: 1

training:
  random_state: 42
  cv_folds: 5
  scoring: accuracy

evaluation:
  metrics:
    - accuracy
    - f1
    - precision
    - recall